[build]
  # Pas de build command (frontend = HTML statique)
  command = "echo 'No build needed'"

  # Publier le frontend uniquement
  publish = "."

  # Ignorer le backend
  ignore = "/api/*"

# Ne pas installer les dépendances npm (backend uniquement)
[build.environment]
  NPM_FLAGS = "--ignore-scripts"

[functions]
  # Pas de functions serverless
  directory = "netlify-disabled"

# Redirections pour SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
