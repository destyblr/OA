/* ============ PIPELINE FLOW ============ */
const STAGES = [
  { key:"fnac",           label:"FNAC Pro",        sub:"scraping",     thr: 25 },
  { key:"ean",            label:"EAN match",       sub:"asin lookup",  thr: 45 },
  { key:"seller_central", label:"Seller Central",  sub:"restrictions", thr: 75 },
  { key:"score",          label:"Score",           sub:"priorité",     thr: 90 },
  { key:"supabase",       label:"Supabase",        sub:"save",         thr: 100 },
];

const PipelineFlow = ({ progress = 0, active = false }) => {
  const currentIdx = active ? Math.max(0, STAGES.findIndex(s => progress < s.thr)) : -1;
  return (
    <div className="relative">
      {/* Background line */}
      <div className="absolute left-[20px] right-[20px] top-[22px] h-px bg-zinc-200"/>
      {/* Progress line */}
      <div className="absolute left-[20px] top-[22px] h-px bg-cobalt-500 transition-[width] duration-500"
           style={{width: `calc((100% - 40px) * ${progress/100})`}}/>

      <div className="relative grid" style={{gridTemplateColumns:`repeat(${STAGES.length}, 1fr)`}}>
        {STAGES.map((s, i) => {
          const isPast = progress >= s.thr;
          const isCurrent = active && i === currentIdx;
          return (
            <div key={s.key} className="flex flex-col items-center gap-2.5">
              <div className="relative">
                <div className={cn(
                  "w-11 h-11 rounded-full grid place-items-center transition-all duration-300 relative z-10",
                  isPast      ? "bg-cobalt-500 text-white shadow-[0_0_0_4px_rgba(37,64,255,0.15)]" :
                  isCurrent   ? "bg-white text-cobalt-500 border-2 border-cobalt-500" :
                                "bg-white border border-zinc-300 text-zinc-400"
                )}>
                  {isCurrent && <span className="absolute inset-0 rounded-full pulse-ring"/>}
                  {isPast
                    ? <I.Check size={16} stroke={2.2}/>
                    : <span className="mono text-[12px] tnum font-semibold">{String(i+1).padStart(2,'0')}</span>}
                </div>
              </div>
              <div className="text-center">
                <div className={cn(
                  "text-[12.5px] font-medium transition-colors",
                  isPast || isCurrent ? "text-zinc-900" : "text-zinc-500"
                )}>{s.label}</div>
                <div className="mono text-[9.5px] uppercase tracking-[0.12em] text-zinc-400 mt-0.5">{s.sub}</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

const ResultsTable = ({ rows, openedScan, onCloseScan }) => {
  const [typeFilter, setTypeFilter] = useState("all");
  const [sort, setSort] = useState("none"); // none | priceAsc | priceDesc | scoreDesc | costAsc | costDesc
  const [sortOpen, setSortOpen] = useState(false);
  // State local pour gérer les unités modifiables et recalculs
  const [editableRows, setEditableRows] = useState([]);

  // Initialiser editableRows quand rows change, avec un ID unique
  useEffect(() => {
    setEditableRows(rows.map((r, idx) => ({...r, _rowId: idx})));
  }, [rows]);

  // Fonction pour mettre à jour les unités et recalculer
  const updateUnits = (index, newUnits) => {
    setEditableRows(prev => {
      const updated = [...prev];
      const row = updated[index];
      const units = Math.max(1, parseInt(newUnits) || 1);
      const costTTC = row.price * units; // Prix FNAC est TTC
      const costHT = costTTC / (1 + TVA);

      // Nouveau calcul du score (1-5 étoiles)
      const typeScore = row.type === 'CATEGORY' ? 2 : 1;
      const costScore = Math.max(0, 2 - (costTTC / 50));
      const efficiencyBonus = (row.type === 'CATEGORY' ? 1.5 : 1.0) / (costTTC / 20);
      const efficiencyScore = Math.min(1, efficiencyBonus);
      const rawScore = typeScore + costScore + efficiencyScore;
      const score = Math.round(Math.max(1, Math.min(5, rawScore)) * 2) / 2;

      updated[index] = {
        ...row,
        units,
        costHT,
        costTTC,
        score
      };
      return updated;
    });
  };

    let res = typeFilter==="all" ? editableRows : editableRows.filter(r=>r.type===typeFilter);

      case "priceDesc": res.sort((a,b)=>b.price-a.price); break;
      case "scoreDesc": res.sort((a,b)=>b.score-a.score); break;
      case "costAsc":   res.sort((a,b)=>a.costHT-b.costHT); break;
      case "costDesc":  res.sort((a,b)=>b.costHT-a.costHT); break;

    return res;

  const grouped = useMemo(() => {
    const g = {};
    for (const r of filtered) (g[r.unlocks] ||= []).push(r);
    return Object.entries(g).sort((a,b) => b[1].length - a[1].length);

            <I.X size={12}/>
            Revenir au scan en cours

        </div>
      )}
      <header className="px-5 py-4 border-b border-zinc-200 flex items-center gap-3">
        <div>
          <h2 className="text-[15px] font-semibold tracking-[-0.01em] text-zinc-900">

            <span className="text-zinc-900 font-medium tnum mono"> {totalTTC.toFixed(2)} €</span> coût total TTC
          </div>
        </div>
        <div className="flex-1"/>
        <div className="flex items-center bg-zinc-100 rounded-md p-0.5">
          {[
            {v:"all", l:"Tous"},
            {v:"CATEGORY", l:"Catégorie"},
            {v:"BRAND", l:"Marque"},
          ].map(t=>(
            <button key={t.v} onClick={()=>setTypeFilter(t.v)} className={cn(
              "h-7 px-2.5 text-[12px] font-medium rounded transition-all",

/* ============ UNRESTRICTED BRANDS ============ */
const UnrestrictedBrandsSection = () => {
  const [brands, setBrands] = useState([]);
  const [loading, setLoading] = useState(true);
  const [expanded, setExpanded] = useState(false);

  const loadUnrestrictedBrands = async () => {
    try {
      console.log('[DEBUG] Chargement marques non restreintes...');

      // 1. Charger les ASIN non restreints
      const { data: restrictions, error: err1 } = await supabase
        .from('restrictions')
        .select('asin')
        .eq('is_restricted', false);

      if (err1) throw err1;
      console.log('[DEBUG] Restrictions non restreintes:', restrictions?.length);

      // 2. Charger les produits correspondants pour récupérer les marques
      const asins = restrictions.map(r => r.asin);
      const { data: products, error: err2 } = await supabase
        .from('products')
        .select('asin, brand')
        .in('asin', asins);

      if (err2) throw err2;
      console.log('[DEBUG] Produits trouvés:', products?.length);

      // 3. Extraire marques depuis les titres si brand="Unknown"
      const extractBrandFromTitle = (title) => {
        if (!title) return 'Unknown';
        const blacklist = ['Jeu', 'Livre', 'DVD', 'Blu', 'Ray', 'Stickers', 'Rasoir', 'Brosse', 'Lisseur', 'Tondeuse', 'Sèche'];
        const words = title.split(' ');
        const brand = words.find(w => {
          // Chercher un mot capitalisé de 3+ lettres, pas dans la blacklist
          return /^[A-Z][a-zA-Z]{2,}/.test(w) && !blacklist.includes(w);
        });
        return brand || 'Unknown';
      };

      // 4. Grouper par marque et compter
      const brandCounts = {};
      products.forEach(p => {
        const brand = (p.brand === 'Unknown' || !p.brand) ? extractBrandFromTitle(p.title) : p.brand;
        brandCounts[brand] = (brandCounts[brand] || 0) + 1;
      });

      // Convertir en array et trier par nombre de produits
      const sortedBrands = Object.entries(brandCounts)
        .map(([name, count]) => ({ name, count }))
        .sort((a, b) => b.count - a.count);

      console.log('[DEBUG] Marques groupées:', sortedBrands.length, sortedBrands.slice(0, 5));

      setBrands(sortedBrands);
      setLoading(false);
    } catch (error) {
      console.error('❌ Erreur chargement marques non restreintes:', error);
      setLoading(false);
    }
  };

  useEffect(() => {
    loadUnrestrictedBrands();
  }, []);

  if (loading) return null;
  if (brands.length === 0) return null;

  const visible = expanded ? brands : brands.slice(0, 10);

  return (
    <section className="rounded-xl border border-zinc-200 bg-white shadow-card overflow-hidden">
      <header className="px-5 py-4 border-b border-zinc-200 flex items-center justify-between">
        <SectionTitle
          kicker="Déjà testées"
          title="Marques non restreintes"
          subtitle={`${brands.length} marques sans restriction trouvées`}
        />
        {brands.length > 10 && (
          <Button
            variant="ghost"
            size="sm"
            iconRight={<I.Chev size={12} className={cn("transition-transform", expanded && "rotate-180")}/>}
            onClick={() => setExpanded(e => !e)}
          >
            {expanded ? "Réduire" : `Tout voir (${brands.length})`}
          </Button>
        )}
      </header>
      <div className="px-5 py-4">
        <div className="flex flex-wrap gap-2">
          {visible.map((b, i) => (
            <div
              key={i}
              className="inline-flex items-center gap-2 px-3 py-1.5 rounded-lg bg-zinc-50 border border-zinc-200 hover:border-zinc-300 transition-colors"
            >
              <span className="text-[13px] text-zinc-900 font-medium">{b.name}</span>
              <span className="mono text-[10px] text-zinc-400 tnum">×{b.count}</span>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
};

/* ============ ASIN RENTABLES VIEW ============ */
const AsinRentablesView = () => {
  const [activeTab, setActiveTab] = useState('brands');
  const [stats, setStats] = useState({});
  const [scanHistory, setScanHistory] = useState([]);
  const [brands, setBrands] = useState([]);
  const [asins, setAsins] = useState([]);
  const [showAllHistory, setShowAllHistory] = useState(false);
  const [brandsPage, setBrandsPage] = useState(1);
  const [asinsPage, setAsinsPage] = useState(1);
  const [filters, setFilters] = useState({
    category: '',
    hasFNAC: '',
    sortBy: 'priority_score',
    asinBrand: '',
    asinCategory: '',
    asinRestricted: ''
  });

  const loadStats = async () => {
    try {
      // Charger directement depuis Supabase
      const { data: scans } = await supabase.from('keepa_scan_history').select('*');
      const { data: brands } = await supabase.from('brand_opportunities').select('*');
      const { data: asins } = await supabase.from('asin_details').select('*');

      setStats({
        totalScans: scans?.length || 0,
        totalBrands: brands?.length || 0,
        totalAsins: asins?.length || 0,
        brandsWithFNAC: brands?.filter(b => b.fnac_product_count > 0).length || 0
      });
    } catch (error) {
      console.error('Error loading stats:', error);
    }
  };

  const loadScanHistory = async () => {
    try {
      const { data, error } = await supabase
        .from('keepa_scan_history')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(10);

      if (!error) setScanHistory(data || []);
    } catch (error) {
      console.error('Error loading history:', error);
    }
  };

  const loadBrands = async () => {
    try {
      let query = supabase.from('brand_opportunities').select('*');

      if (filters.category) {
        query = query.eq('category', filters.category);
      }
      if (filters.hasFNAC === 'yes') {
        query = query.gt('fnac_product_count', 0);
      } else if (filters.hasFNAC === 'no') {
        query = query.eq('fnac_product_count', 0);
      }

      const sortField = filters.sortBy === 'priority_score' ? 'priority_score' :
                       filters.sortBy === 'avg_bsr' ? 'avg_bsr' : 'created_at';
      const sortAsc = filters.sortBy === 'avg_bsr';

      const { data, error } = await query
        .order(sortField, { ascending: sortAsc })
        .limit(50);

      if (!error) setBrands(data || []);
    } catch (error) {
      console.error('Error loading brands:', error);
    }
  };

  const loadAsins = async () => {
    try {
      let query = supabase.from('asin_details').select('*');

      if (filters.asinBrand) {
        query = query.eq('brand', filters.asinBrand);
      }
      if (filters.asinCategory) {
        query = query.eq('category', filters.asinCategory);
      }
      if (filters.asinRestricted === 'yes') {
        query = query.eq('is_restricted', true);
      } else if (filters.asinRestricted === 'no') {
        query = query.eq('is_restricted', false);
      }

      const { data, error } = await query
        .order('first_seen', { ascending: false })
        .limit(100);

      if (!error) setAsins(data || []);
    } catch (error) {
      console.error('Error loading ASINs:', error);
    }
  };

  // Trier les ASIN selon l'option choisie
  const sortedAsins = useMemo(() => {
    if (!asins || asins.length === 0) return [];
    const sorted = [...asins];
    const sortType = filters.asinSort || 'bsr_asc';

    switch(sortType) {
      case 'bsr_asc':
        return sorted.sort((a, b) => (a.bsr || 999999) - (b.bsr || 999999));
      case 'bsr_desc':
        return sorted.sort((a, b) => (b.bsr || 0) - (a.bsr || 0));
      case 'price_asc':
        return sorted.sort((a, b) => (a.price_amazon || 999999) - (b.price_amazon || 999999));
      case 'price_desc':
        return sorted.sort((a, b) => (b.price_amazon || 0) - (a.price_amazon || 0));
      case 'date_desc':
        return sorted.sort((a, b) => new Date(b.first_seen || 0) - new Date(a.first_seen || 0));
      default:
        return sorted;
    }
  }, [asins, filters.asinSort]);

  // Pagination
  const displayedHistory = useMemo(() => {
    return showAllHistory ? scanHistory : scanHistory.slice(0, 5);
  }, [scanHistory, showAllHistory]);

  const paginatedBrands = useMemo(() => {
    const start = (brandsPage - 1) * 10;
    return brands.slice(start, start + 10);
  }, [brands, brandsPage]);

  const paginatedAsins = useMemo(() => {
    const start = (asinsPage - 1) * 25;
    return sortedAsins.slice(start, start + 25);
  }, [sortedAsins, asinsPage]);

  const totalBrandPages = Math.ceil(brands.length / 10);
  const totalAsinPages = Math.ceil(sortedAsins.length / 25);

    try {

        headers: { 'Content-Type': 'application/json' }

      const data = await res.json();

        alert('Scan lancé avec succès !');
        setTimeout(() => { loadStats(); loadScanHistory(); loadBrands(); }, 2000);
      }
    } catch (error) {
      alert('Erreur lors du lancement du scan');
    }
  };

  useEffect(() => {
    loadStats();
    loadScanHistory();
    loadBrands();

    if (minutes < 60) return `il y a ${minutes}min`;

    if (hours < 24) return `il y a ${hours}h`;

    <>

        <div className="flex items-center justify-between mb-8">

            Scanner maintenant
          </Button>
        </div>

        <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">

                </thead>
                <tbody>
                  {sortedAsins.length === 0 ? (
                    <tr><td colSpan={11} className="px-4 py-8 text-center text-zinc-500">Aucun ASIN</td></tr>
                  ) : (
                    paginatedAsins.map((asin, i) => (
                      <tr key={i} className="border-b border-zinc-150">
                        <td className="px-4 py-3">
                          <a href={`https://www.amazon.fr/dp/${asin.asin}`} target="_blank" rel="noopener" className="mono text-[12px] text-cobalt-600 hover:underline">
                            {asin.asin}
                          </a>
                        </td>
                        <td className="px-4 py-3 text-[13px] font-medium">{asin.brand}</td>
                        <td className="px-4 py-3 text-[13px] truncate max-w-[200px]">{asin.title}</td>
                        <td className="px-4 py-3 text-[13px] cursor-help" title={`BSR ${asin.bsr?.toLocaleString()} - ${asin.bsr < 1000 ? 'Top seller' : asin.bsr < 10000 ? 'Très bon' : 'Bon'}`}>
                          {asin.bsr?.toLocaleString()}
                        </td>
                        <td className="px-4 py-3 mono text-[12px]">
                          {asin.bsr_drops_30d ? (
                            <span className="text-emerald-600 font-medium">{asin.bsr_drops_30d}</span>
                          ) : (
                            <span className="text-zinc-400">--</span>
                          )}
                        </td>
                        <td className="px-4 py-3 text-[13px]">
                          {asin.price_amazon && asin.price_amazon > 0 ? (
                            `${asin.price_amazon.toFixed(2)}€`
                          ) : (
                            <span className="text-zinc-400 cursor-help" title="Prix Amazon non disponible">--</span>
                          )}
                        </td>
                        <td className="px-4 py-3">
                          {asin.rating && asin.rating > 0 ? (
                            <div className="flex items-center gap-1">
                              <Stars value={Math.floor(asin.rating)} size={10}/>
                              <span className="text-[11px] text-zinc-500">({asin.rating.toFixed(1)})</span>
                            </div>
                          ) : (
                            <span className="text-zinc-400">--</span>
                          )}
                        </td>
                        <td className="px-4 py-3 mono text-[12px]">{asin.seller_count || 0}</td>
                        <td className="px-4 py-3">
                          {asin.amazon_present ? (
                            <Badge tone="amber">Oui</Badge>
                          ) : (
                            <Badge tone="green">Non</Badge>
                          )}
                        </td>
                        <td className="px-4 py-3">
                          {asin.is_restricted ? (
                            <Badge tone="amber">{asin.restriction_type}</Badge>
                          ) : (
                            <Badge tone="green">Non</Badge>
                          )}
                        </td>
                        <td className="px-4 py-3 text-[12px] text-zinc-500">{timeAgo(asin.first_seen)}</td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
              {/* Pagination ASIN */}
              {totalAsinPages > 1 && (
                <div className="px-5 py-4 border-t border-zinc-200 flex items-center justify-center gap-2">
                  <Button
                    size="sm"
                    variant="ghost"
                    disabled={asinsPage === 1}
                    onClick={() => setAsinsPage(asinsPage - 1)}
                    icon={<I.ChevronLeft size={14}/>}
                  >
                    Précédent
                  </Button>
                  <span className="text-[13px] text-zinc-600">
                    Page {asinsPage} / {totalAsinPages}
                  </span>
                  <Button
                    size="sm"
                    variant="ghost"
                    disabled={asinsPage === totalAsinPages}
                    onClick={() => setAsinsPage(asinsPage + 1)}
                    iconRight={<I.ChevronRight size={14}/>}
                  >
                    Suivant
                  </Button>
                </div>
              )}
            </section>
          </div>
        )}

        {/* Historique des scans (en bas) */}
        <div className="px-4 md:px-7 pb-8">
          <section className="rounded-xl border border-zinc-200 bg-white shadow-card overflow-hidden">
            <header className="px-5 py-4 border-b border-zinc-200">
              <h2 className="text-[15px] font-semibold tracking-[-0.01em] text-zinc-900">📜 Historique des scans</h2>
            </header>
            <table className="w-full">
              <thead className="bg-zinc-50/70 border-b border-zinc-200">
                <tr>
                  {['Date','Catégorie','ASIN','Marques','FNAC','Tokens','Durée','Statut'].map((h,i) => (
                    <th key={i} className="px-4 py-2.5 text-left mono text-[10px] uppercase tracking-[0.15em] text-zinc-500 font-medium">{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {displayedHistory.length === 0 ? (
                  <tr><td colSpan={8} className="px-4 py-8 text-center text-zinc-500">Aucun scan</td></tr>
                ) : (
                  displayedHistory.map((scan, i) => (
                    <tr key={i} className="border-b border-zinc-150 hover:bg-zinc-50 transition-colors group">
                      <td className="px-4 py-3 text-[13px]">{new Date(scan.scan_date).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</td>
                      <td className="px-4 py-3 text-[13px] font-medium relative">
                        <span className="cursor-help" title={`BSR: ${scan.bsr_min || 0}-${scan.bsr_max || 0} | Prix: ${scan.price_min || 0}-${scan.price_max || 0}€ | Max vendeurs: ${scan.max_sellers || 5}`}>
                          {scan.category}
                        </span>
                      </td>
                      <td className="px-4 py-3 text-[13px]">{scan.asins_found || 0}</td>
                      <td className="px-4 py-3 text-[13px] font-semibold text-emerald-600">{scan.brands_found || 0}</td>
                      <td className="px-4 py-3 text-[13px]">{scan.brands_with_fnac || 0}</td>
                      <td className="px-4 py-3 text-[13px]">{scan.tokens_used || 0}</td>
                      <td className="px-4 py-3 text-[13px]">{scan.duration_seconds || 0}s</td>
                      <td className="px-4 py-3">
                        <Badge tone={scan.status === 'success' || scan.status === 'completed' ? 'green' : scan.status === 'running' ? 'blue' : 'amber'}>
                          {scan.status === 'success' || scan.status === 'completed' ? 'Terminé' : scan.status === 'running' ? 'En cours' : 'Échoué'}
                        </Badge>
                      </td>
                    </tr>
                  ))
                )}
              </tbody>
            </table>
            {scanHistory.length > 5 && (
              <div className="px-5 py-3 border-t border-zinc-200 text-center">
                <Button
                  size="sm"
                  variant="ghost"
                  onClick={() => setShowAllHistory(!showAllHistory)}
                  iconRight={showAllHistory ? <I.ChevronUp size={14}/> : <I.ChevronDown size={14}/>}
                >
                  {showAllHistory ? 'Voir moins' : `Voir plus (${scanHistory.length - 5} autres)`}
                </Button>
              </div>
            )}
          </section>
        </div>
      </div>
    </>
  );
};

/* ============ PAGE ============ */
function App() {
  // Restaurer l'onglet depuis l'URL hash ou localStorage
  const getInitialView = () => {
    const hash = window.location.hash.slice(1); // Enlever le #
    if (hash && ['ungating', 'asin-rentables'].includes(hash)) {
      return hash;
    }
    return localStorage.getItem('activeView') || 'ungating';
  };

  const [activeView, setActiveView] = useState(getInitialView());
  const [form, setForm] = useState({ maxPrice: 20, cats:["baby","toys","health","pet"] });
  const [scanning, setScanning] = useState(false);
  const [progress, setProgress] = useState(0);
  const [results, setResults] = useState([]);
  const [history, setHistory] = useState(HISTORY);
  const [openedScan, setOpenedScan] = useState(null);
  const [loading, setLoading] = useState(true);
  const ref = useRef(null);

  // Sauvegarder l'onglet actif dans l'URL et localStorage
  useEffect(() => {
    window.location.hash = activeView;
    localStorage.setItem('activeView', activeView);
  }, [activeView]);

  // Charger l'historique des scans depuis Supabase
  const loadScansHistory = async () => {
    try {
      const { data, error } = await supabase
        .from('scans')
        .select('*')
        .order('scan_date', { ascending: false })
        .limit(20);

      if (error) throw error;

      const formattedHistory = data.map(scan => {
        // Convertir en heure locale française (Europe/Paris)
        const date = new Date(scan.scan_date);
        const localDate = new Date(date.toLocaleString('en-US', { timeZone: 'Europe/Paris' }));

        const dd = String(localDate.getDate()).padStart(2, "0");
        const months = ["jan","fév","mar","avr","mai","juin","juil","aoû","sep","oct","nov","déc"];
        const dateStr = `${dd} ${months[localDate.getMonth()]} · ${String(localDate.getHours()).padStart(2,"0")}:${String(localDate.getMinutes()).padStart(2,"0")}`;

        // Détecter si c'est une catégorie (dans CATS) ou une marque (texte direct)
        const catLabels = (scan.categories || []).map(id => {
          const cat = CATS.find(c => c.id === id);
          return cat ? cat.label : id; // Si pas dans CATS, c'est une marque → utiliser directement
        }).filter(Boolean);
        const filtersStr = `${catLabels.slice(0,2).join(", ")}${catLabels.length>2?` +${catLabels.length-2}`:""} · ≤ ${scan.max_price}€`;

        return {
          id: scan.id.toString(),
          date: dateStr,
          filters: filtersStr,
          results: scan.results_count || 0,
          cost: scan.total_cost || 0,
          status: scan.status === 'completed' ? 'done' : scan.status === 'running' ? 'running' : 'failed'
        };
      });

      setHistory(formattedHistory);
    } catch (error) {
      console.error('Erreur chargement historique:', error);
    }
  };

  // Charger les derniers résultats depuis Supabase
  const loadResultsFromSupabase = async (scanId = null) => {
    setLoading(true);
    try {
      // 1. Charger les opportunities (avec filtre optionnel par scan_id)
      let query = supabase
        .from('opportunities')
        .select(`
          *,
          products!inner(*),
          restrictions!inner(*)
        `)
        .order('created_at', { ascending: false });

      if (scanId) {
        query = query.eq('scan_id', scanId);
      } else {
        query = query.limit(100);
      }

      const { data, error } = await query;

      if (error) throw error;

      // 2. Charger les brand_requirements
      const { data: brandReqs, error: brandError } = await supabase
        .from('brand_requirements')
        .select('*');

      if (brandError) console.warn('brand_requirements non disponible:', brandError);

      // Créer un map pour recherche rapide
      const brandRequirementsMap = {};
      if (brandReqs) {
        brandReqs.forEach(br => {
          brandRequirementsMap[br.brand_name.toUpperCase()] = br.units_required;
        });
      }

      // 3. FILTRER LES MÉDIAS (livres, CD, DVD, magazines)
      const filteredData = data.filter(opp => {
        const title = (opp.products.title || '').toLowerCase();
        const brand = (opp.products.brand || '').toLowerCase();
        const ean = opp.products.ean || '';
        const approvalText = (opp.restrictions.approval_text || '').toLowerCase();

        // Livres (ISBN)
        if (ean.startsWith('978') || ean.startsWith('979')) return false;

        // CD/Musique
        const musicKeywords = ['cd ', ' cd', 'album', 'vinyle', 'vinyl', 'disque', 'compilation', 'soundtrack', 'bande originale'];
        if (musicKeywords.some(kw => title.includes(kw))) return false;

        // DVD/Vidéo
        const videoKeywords = ['dvd', 'blu-ray', 'bluray', 'film', 'movie', 'série', 'series', 'coffret', 'saison'];
        if (videoKeywords.some(kw => title.includes(kw))) return false;

        // Magazines/Presse
        const pressKeywords = ['magazine', 'revue', 'hors-série', 'mensuel', 'hebdo', 'journal', 'numéro', 'n°'];
        const pressBrands = ['grazia', 'elle', 'marie claire', 'vogue', 'gala', 'closer'];
        if (pressKeywords.some(kw => title.includes(kw) || brand.includes(kw))) return false;
        if (pressBrands.some(b => brand.includes(b))) return false;

        // BLACKLIST MARQUES MÉDIAS (labels musique, éditeurs livres)
        const mediaBrandsBlacklist = [
          // Livres
          'livre de poche', 'leduc.s editions', 'marabout', 'gallimard', 'actes sud',
          'j\'ai lu', 'taschen', 'libertalia', 'kimane', 'fleurus', 'hachette india',
          'odile jacob', 'payot', 'points', 'giboulées', 'gautier languereau',
          'nobi nobi', 'rivages', 'desclée de brouwer', 'louverture', 'dragon d\'or',
          'omake books', 'eyrolles', 'de la martinière jeunesse', 'quelle histoire',
          'auzou', 'livres de collection', 'ign',
          // Musique
          'warner music', 'island', 'imports', 'cooking vinyl', '4 a d',
          'universal music group', 'verycords', 'pias', 'sony music', 'emi',
          'columbia', 'atlantic',
          // Vidéo
          'seven 7', 'pathe', 'warner bros', 'universal pictures', 'paramount'
        ];

        if (mediaBrandsBlacklist.some(b => approvalText.includes(b))) return false;

        return true; // Produit physique valide
      });

      // 4. Transformer et recalculer avec brand_requirements
      const formattedResults = filteredData.map(opp => {
        const brandName = opp.restrictions.approval_text?.toUpperCase() || '';
        const manualUnits = brandRequirementsMap[brandName];
        const units = manualUnits || opp.restrictions.units_required || 1;

        // Recalculer les coûts avec les bonnes unités
        const costTTC = opp.products.price * units;
        const costHT = costTTC / 1.20;

        // Nouveau calcul du score (1-5 étoiles)
        const type = opp.restrictions.type;

        // Base selon type (1-2 étoiles)
        const typeScore = type === 'CATEGORY' ? 2 : 1;

        // Coût (0-2 étoiles) - inversement proportionnel
        const costScore = Math.max(0, 2 - (costTTC / 50));

        // Efficacité (0-1 étoile)
        const efficiencyBonus = (type === 'CATEGORY' ? 1.5 : 1.0) / (costTTC / 20);
        const efficiencyScore = Math.min(1, efficiencyBonus);

        // Total (1-5 étoiles, arrondi à 0.5)
        const rawScore = typeScore + costScore + efficiencyScore;
        const score = Math.round(Math.max(1, Math.min(5, rawScore)) * 2) / 2;

        return {
          brand: opp.products.brand,
          title: opp.products.title,
          price: opp.products.price,
          ean: opp.products.ean,
          asin: opp.restrictions.asin,
          url: opp.products.url,
          units: units,
          type: type,
          unlocks: opp.restrictions.approval_text,
          costHT: costHT,
          costTTC: costTTC,
          score: score,
          hot: score >= 4
        };
      });

      setResults(formattedResults);
    } catch (error) {
      console.error('Erreur Supabase:', error);
    } finally {
      setLoading(false);
    }
  };

  // Charger au démarrage
  useEffect(() => {
    loadResultsFromSupabase();
    loadScansHistory();
  }, []);

  const openScan = async (h) => {
    setLoading(true);
    setOpenedScan({id: h.id, date: h.date, filters: h.filters});

    // Charger les résultats de ce scan depuis Supabase
    await loadResultsFromSupabase(h.id);

    setTimeout(() => {
      const el = document.getElementById("results-section");
      if (el) window.scrollTo({ top: el.offsetTop - 70, behavior: "smooth" });
    }, 50);
  };
  const closeScan = async () => {
    setOpenedScan(null);
    await loadResultsFromSupabase(); // Recharger tous les résultats
  };

  const launchScan = async (categories) => {
    setScanning(true);
    setProgress(0);

    try {
      // Lancer le scan sur le backend
      const response = await fetch('http://localhost:3000/api/ungating/scan/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          maxPrice: 20,
          cats: categories
        })
      });

      const { scanId } = await response.json();

      // Connecter Socket.io pour les updates temps réel
      const socket = io('http://localhost:3000');

      socket.on(`scan:${scanId}:progress`, (data) => {
        setProgress(data.progress);
      });

      socket.on(`scan:${scanId}:complete`, async (results) => {
        setScanning(false);
        setProgress(100);

        // Recharger les résultats et l'historique depuis Supabase
        await loadResultsFromSupabase(scanId);
        await loadScansHistory();

        socket.disconnect();
      });

      socket.on(`scan:${scanId}:error`, (error) => {
        setScanning(false);
        alert(`Erreur du scan: ${error.error}`);
        socket.disconnect();
      });

    } catch (error) {
      setScanning(false);
      alert(`Erreur de connexion au backend: ${error.message}`);
    }
  };

  const start = () => launchScan(form.cats);
  const quickLaunch = (categoryId) => launchScan([categoryId]);
  useEffect(()=> () => ref.current && clearInterval(ref.current), []);

  return (
    <div className="flex md:pl-14" data-screen-label={activeView === 'ungating' ? 'Ungating' : 'ASIN Rentables'}>
      <Sidebar activeView={activeView} setActiveView={setActiveView}/>
      <main className="flex-1 min-w-0">
        {activeView === 'ungating' ? (
          <>
            <Topbar onRun={start} scanning={scanning} onRefresh={loadResultsFromSupabase} loading={loading}/>
            <PageHero results={results} openedScan={openedScan}/>
            <div className="px-4 md:px-7 pb-10 space-y-6">
              <QuickLaunchCards/>
              <PipelineCard progress={progress} scanning={scanning}/>
              <ResultsTable rows={results} openedScan={openedScan} onCloseScan={closeScan}/>
              <HistoryTable history={history} onOpen={openScan}/>
              {/* <UnrestrictedBrandsSection/> */}
            </div>
          </>
        ) : (
          <AsinRentablesView/>
        )}

        <footer className="border-t border-zinc-200 px-4 md:px-7 py-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 text-[11.5px] text-zinc-500">
          <span>© 2026 OA · Open Arbitrage</span>
          <span className="mono uppercase tracking-wider">v2.4.1 · build a9f1c</span>
        </footer>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);


</script>
</body>
</html>
