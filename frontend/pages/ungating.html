/* ============ PIPELINE FLOW ============ */
const STAGES = [
  { key:"metro",   label:"Metro",      sub:"scraping",     thr: 18 },
  { key:"ean",     label:"EAN match",  sub:"asin lookup",  thr: 38 },
  { key:"amazon",  label:"Amazon",     sub:"catalogue",    thr: 58 },
  { key:"sp_api",  label:"SP-API",     sub:"restrictions", thr: 78 },
  { key:"score",   label:"Score",      sub:"priorité",     thr: 92 },
  { key:"supabase",label:"Supabase",   sub:"save",         thr: 100 },
];

const PipelineFlow = ({ progress = 0, active = false }) => {
  const currentIdx = active ? Math.max(0, STAGES.findIndex(s => progress < s.thr)) : -1;
  return (
    <div className="relative">
      {/* Background line */}
      <div className="absolute left-[20px] right-[20px] top-[22px] h-px bg-zinc-200"/>
      {/* Progress line */}
      <div className="absolute left-[20px] top-[22px] h-px bg-cobalt-500 transition-[width] duration-500"
           style={{width: `calc((100% - 40px) * ${progress/100})`}}/>

      <div className="relative grid" style={{gridTemplateColumns:`repeat(${STAGES.length}, 1fr)`}}>
        {STAGES.map((s, i) => {
          const isPast = progress >= s.thr;
          const isCurrent = active && i === currentIdx;
          return (
            <div key={s.key} className="flex flex-col items-center gap-2.5">
              <div className="relative">
                <div className={cn(
                  "w-11 h-11 rounded-full grid place-items-center transition-all duration-300 relative z-10",
                  isPast      ? "bg-cobalt-500 text-white shadow-[0_0_0_4px_rgba(37,64,255,0.15)]" :
                  isCurrent   ? "bg-white text-cobalt-500 border-2 border-cobalt-500" :
                                "bg-white border border-zinc-300 text-zinc-400"
                )}>
                  {isCurrent && <span className="absolute inset-0 rounded-full pulse-ring"/>}
                  {isPast
                    ? <I.Check size={16} stroke={2.2}/>
                    : <span className="mono text-[12px] tnum font-semibold">{String(i+1).padStart(2,'0')}</span>}
                </div>
              </div>
              <div className="text-center">
                <div className={cn(
                  "text-[12.5px] font-medium transition-colors",
                  isPast || isCurrent ? "text-zinc-900" : "text-zinc-500"
                )}>{s.label}</div>
                <div className="mono text-[9.5px] uppercase tracking-[0.12em] text-zinc-400 mt-0.5">{s.sub}</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

const ResultsTable = ({ rows, openedScan, onCloseScan }) => {
  const [typeFilter, setTypeFilter] = useState("all");
  const [sort, setSort] = useState("none"); // none | priceAsc | priceDesc | scoreDesc | costAsc | costDesc
  const [sortOpen, setSortOpen] = useState(false);
  const filtered = useMemo(() => {
    let res = typeFilter==="all" ? rows : rows.filter(r=>r.type===typeFilter);
    res = [...res];
    switch(sort) {
      case "priceAsc":  res.sort((a,b)=>a.price-b.price); break;
      case "priceDesc": res.sort((a,b)=>b.price-a.price); break;
      case "scoreDesc": res.sort((a,b)=>b.score-a.score); break;
      case "costAsc":   res.sort((a,b)=>a.costHT-b.costHT); break;
      case "costDesc":  res.sort((a,b)=>b.costHT-a.costHT); break;
    }
    return res;
  }, [rows, typeFilter, sort]);
  const grouped = useMemo(() => {
    const g = {};
    for (const r of filtered) (g[r.unlocks] ||= []).push(r);
    return Object.entries(g).sort((a,b) => b[1].length - a[1].length);
  }, [filtered]);
  const totalTTC = filtered.reduce((s,r)=>s + r.costHT*(1+TVA), 0);

  return (
    <section id="results-section" className={cn("rounded-xl border bg-white shadow-card overflow-hidden transition-all", openedScan ? "border-cobalt-500 ring-4 ring-cobalt-500/15" : "border-zinc-200")}>

          <span className="text-[12.5px] text-cobalt-700">
            <span className="font-medium">Snapshot du scan <span className="mono">#{openedScan.id}</span></span>
            <span className="text-cobalt-700/70"> · {openedScan.date} · {openedScan.filters}</span>
          </span>
          <div className="flex-1"/>
          <button onClick={onCloseScan} className="inline-flex items-center gap-1.5 h-7 px-2.5 rounded-md text-[12px] font-medium text-cobalt-700 hover:bg-cobalt-100 transition-colors">
            <I.X size={12}/>
            Revenir au scan en cours
          </button>
        </div>
      )}
      <header className="px-5 py-4 border-b border-zinc-200 flex items-center gap-3">
        <div>
          <h2 className="text-[15px] font-semibold tracking-[-0.01em] text-zinc-900">
            {openedScan ? <>Scan archivé <span className="mono text-cobalt-500">#{openedScan.id}</span></> : "Résultats du scan"}
          </h2>
          <div className="text-[12px] text-zinc-500 mt-0.5">
            <span className="tnum mono">{filtered.length}</span> produits ·
            <span className="text-zinc-900 font-medium tnum mono"> {totalTTC.toFixed(2)} €</span> coût total TTC
          </div>
        </div>
        <div className="flex-1"/>
        <div className="flex items-center bg-zinc-100 rounded-md p-0.5">
          {[
            {v:"all", l:"Tous"},
            {v:"CATEGORY", l:"Catégorie"},
            {v:"BRAND", l:"Marque"},
          ].map(t=>(
            <button key={t.v} onClick={()=>setTypeFilter(t.v)} className={cn(
              "h-7 px-2.5 text-[12px] font-medium rounded transition-all",
              typeFilter===t.v ? "bg-white shadow-card text-zinc-900" : "text-zinc-500 hover:text-zinc-900"

        </div>
        {/* Sort — click to open */}
        <div className="relative">
          <Button variant={sort!=="none" ? "primary" : "secondary"} size="sm"
            icon={<I.Filter size={12}/>}
            iconRight={<I.Chev size={11} className={cn("transition-transform", sortOpen && "rotate-180")}/>}
            onClick={()=>setSortOpen(o=>!o)}>
            {{
              none:      "Trier",
              priceAsc:  "Prix ↑",
              priceDesc: "Prix ↓",
              scoreDesc: "Score ↓",

              costDesc:  "Coût ↓",

                      <div className="flex items-center gap-3">
                        <div className="w-9 h-9 shrink-0 rounded-md bg-zinc-100 border border-zinc-200 grid place-items-center text-[10.5px] font-semibold text-zinc-700">
                          {r.brand.split(" ").map(w=>w[0]).slice(0,2).join("")}
                        </div>
                        <div className="min-w-0 flex-1">
                          <div className="flex items-center gap-1.5">
                            <span className="text-[13.5px] font-medium text-zinc-900 truncate">{r.brand}</span>
                            {r.hot && <Badge tone="amber" dot className="!h-[16px] !text-[9.5px] !font-semibold uppercase tracking-wider shrink-0">Hot</Badge>}
                          </div>
                          <div className="mono text-[10.5px] tnum text-zinc-400 tracking-wider truncate mt-0.5">
                            {r.asin}
                          </div>
                        </div>
                      </div>
                    </td>
                    <td className="px-2 py-3 text-right text-[13px] tnum text-zinc-900 whitespace-nowrap align-middle">{r.price.toFixed(2)} €</td>
                    <td className="px-2 py-3 text-right whitespace-nowrap align-middle">
                      <div className="text-[13px] tnum text-zinc-900 font-medium">×{r.units}</div>
                      <div className="mono text-[9.5px] uppercase tracking-wider text-cobalt-500">auto</div>
                    </td>
                    <td className="px-2 py-3 text-right whitespace-nowrap align-middle">
                      <div className="text-[13.5px] tnum font-semibold text-zinc-900">{(r.costHT*(1+TVA)).toFixed(2)} €</div>
                      <div className="mono text-[10px] tnum text-zinc-400">
                        {r.costHT.toFixed(2)} HT · +{(r.costHT*TVA).toFixed(2)} TVA
                      </div>
                    </td>
                    <td className="px-2 py-3 align-middle hidden xl:table-cell"><TypeBadge type={r.type}/></td>
                    <td className="px-2 py-3 align-middle"><Stars value={r.score}/></td>
                    <td className="px-2 py-3 pr-5 align-middle">
                      <div className="flex items-center justify-end">
                        <a
                          href={`https://www.metro.fr/marketplace/product/${encodeURIComponent(r.brand.toLowerCase().replace(/[^a-z0-9]+/g,'-'))}-${r.ean}`}
                          target="_blank"
                          rel="noopener noreferrer"
                          title={`Acheter sur Metro · EAN ${r.ean}`}
                          className="inline-flex items-center justify-center gap-1.5 h-8 px-3 text-[12.5px] rounded-md font-medium bg-white text-zinc-900 border border-zinc-200 hover:border-zinc-300 hover:bg-zinc-50 shadow-card transition-all"
                        >
                          <span className="hidden lg:inline">Acheter</span>
                          <span className="mono text-[10px] uppercase tracking-wider text-zinc-400 hidden xl:inline">Metro</span>
                          <I.ArrowDR size={12}/>
                        </a>
                      </div>
                    </td>
                  </tr>
                ))}
              </React.Fragment>
            ))}
          </tbody>
        </table>
      </div>

      <footer className="px-5 py-3 border-t border-zinc-200 bg-zinc-50/40 flex items-center justify-between gap-4 flex-wrap">
        <div className="flex items-center gap-5 mono text-[11px] uppercase tracking-wider">
          <div className="flex items-baseline gap-1.5">
            <span className="text-zinc-500">HT</span>
            <span className="text-zinc-900 tnum text-[12.5px] normal-case">{(totalTTC/(1+TVA)).toFixed(2)} €</span>
          </div>
          <div className="flex items-baseline gap-1.5">
            <span className="text-zinc-500">TVA</span>
            <span className="text-zinc-900 tnum text-[12.5px] normal-case">{(totalTTC - totalTTC/(1+TVA)).toFixed(2)} €</span>
          </div>
          <div className="flex items-baseline gap-1.5 pl-4 border-l border-zinc-200">
            <span className="text-zinc-900 font-semibold">TTC</span>
            <span className="text-zinc-900 tnum text-[14px] font-semibold normal-case tracking-normal">{totalTTC.toFixed(2)} €</span>
          </div>
        </div>
        <span className="mono text-[10.5px] uppercase tracking-wider text-zinc-400 tnum">
          {filtered.length} {filtered.length>1?"résultats":"résultat"}
        </span>
      </footer>
    </section>
  );
};

/* ============ HISTORY ============ */
const HistoryTable = ({ history, onOpen }) => {
  const [expanded, setExpanded] = useState(false);
  const visible = expanded ? history : history.slice(0,4);
  return (
  <section id="history-section" className="rounded-xl border border-zinc-200 bg-white shadow-card overflow-hidden">
    <header className="px-5 py-4 border-b border-zinc-200 flex items-center justify-between">
      <SectionTitle kicker="Archives" title="Historique des scans"/>
      <Button variant="ghost" size="sm" iconRight={<I.Chev size={12} className={cn("transition-transform", expanded && "rotate-180")}/>}
        onClick={()=>setExpanded(e=>!e)}>
        {expanded ? "Réduire" : `Tout voir (${history.length})`}
      </Button>
    </header>
    <table className="w-full">
      <thead className="bg-zinc-50/70 border-b border-zinc-200">
        <tr>
          {["#","Date","Filtres","Résultats","Coût total","Statut",""].map((c,i)=>(
            <th key={i} className={cn(
              "py-2.5 mono text-[10px] uppercase tracking-[0.15em] text-zinc-500 font-medium",
              i===0 && "pl-5",
              (i===3||i===4) ? "text-right pr-3" : "px-3 text-left",
              i===6 && "pr-5"
            )}>{c}</th>
          ))}
        </tr>
      </thead>
      <tbody>
        {visible.map((h,i)=>(
          <tr key={h.id} className={cn("row border-b border-zinc-150 last:border-b-0 cursor-pointer", i===0 && h.fresh && "bg-cobalt-50/40")}
              onClick={()=>onOpen(h)}>
            <td className="pl-5 pr-3 py-3 mono text-[12px] tnum text-zinc-900">
              <span className="inline-flex items-center gap-1.5">
                #{h.id}
                {i===0 && h.fresh && <span className="w-1.5 h-1.5 rounded-full bg-cobalt-500 pulse-dot"/>}
              </span>
            </td>
            <td className="px-3 py-3 text-[13px] text-zinc-700">{h.date}</td>
            <td className="px-3 py-3 text-[13px] text-zinc-900">{h.filters}</td>
            <td className="px-3 py-3 text-right mono text-[13px] tnum text-zinc-900 font-medium">{h.results}</td>
            <td className="px-3 py-3 text-right mono text-[13px] tnum text-zinc-700">{h.cost.toFixed(2)} €</td>
            <td className="px-3 py-3">
              {h.status==="done"
                ? <Badge tone="green" dot>Terminé</Badge>
                : <Badge tone="neutral" dot>Vide</Badge>}
            </td>
            <td className="px-3 py-3 pr-5 text-right">
              <Button size="sm" variant="ghost" iconRight={<I.Arrow size={12}/>} onClick={(e)=>{e.stopPropagation(); onOpen(h);}}>Ouvrir</Button>
            </td>
          </tr>
        ))}
      </tbody>
    </table>
  </section>
  );
};

/* ============ PAGE ============ */
function App() {
  const [form, setForm] = useState({ maxPrice: 12, cats:["beauty","grocery","health","baby"] });
  const [scanning, setScanning] = useState(false);
  const [progress, setProgress] = useState(0);
  const [results, setResults] = useState(MOCK);
  const [history, setHistory] = useState(HISTORY);
  const [openedScan, setOpenedScan] = useState(null);
  const ref = useRef(null);

  const openScan = (h) => {
    setResults(h.rows || []);
    if (h.form) setForm(h.form);
    setOpenedScan({id: h.id, date: h.date, filters: h.filters});
    setTimeout(() => {
      const el = document.getElementById("results-section");
      if (el) window.scrollTo({ top: el.offsetTop - 70, behavior: "smooth" });
    }, 50);
  };
  const closeScan = () => {
    setResults(MOCK);
    setOpenedScan(null);
  };

  const start = async () => {
    setScanning(true);
    setProgress(0);

    try {
      // Lancer le scan sur le backend
      const response = await fetch('http://localhost:3000/api/ungating/scan/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          maxPrice: form.maxPrice,
          cats: form.cats
        })
      });

      const { scanId } = await response.json();

      // Connecter Socket.io pour les updates temps réel
      const socket = io('http://localhost:3000');

      socket.on(`scan:${scanId}:progress`, (data) => {
        setProgress(data.progress);
      });

      socket.on(`scan:${scanId}:complete`, (results) => {
        setScanning(false);
        setProgress(100);
        setResults(results);

        // Append to history
        const totalCost = results.reduce((s,r)=>s + r.costTTC, 0);
        const catLabels = form.cats.map(id => CATS.find(c=>c.id===id)?.label).filter(Boolean);
        const filtersStr = `${catLabels.slice(0,2).join(", ")}${catLabels.length>2?` +${catLabels.length-2}`:""} · ≤ ${form.maxPrice}€`;
        const now = new Date();
        const dd = String(now.getDate()).padStart(2,"0");
        const months = ["jan","fév","mar","avr","mai","juin","juil","aoû","sep","oct","nov","déc"];
        const dateStr = `${dd} ${months[now.getMonth()]} · ${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
        const nextId = String(parseInt(history[0]?.id || "2200")+1);

        setHistory(h => [{
          id: nextId,
          date: dateStr,
          filters: filtersStr,
          results: results.length,
          cost: totalCost,
          status: results.length>0 ? "done" : "empty",
          fresh: true,
        }, ...h.map(x=>({...x, fresh:false}))].slice(0,6));

        socket.disconnect();
      });

      socket.on(`scan:${scanId}:error`, (error) => {
        setScanning(false);
        alert(`Erreur du scan: ${error.error}`);
        socket.disconnect();
      });

    } catch (error) {
      setScanning(false);
      alert(`Erreur de connexion au backend: ${error.message}`);
    }
  };
  useEffect(()=> () => ref.current && clearInterval(ref.current), []);

  return (
    <div className="flex md:pl-14" data-screen-label="Ungating">
      <Sidebar/>
      <main className="flex-1 min-w-0">
        <Topbar onRun={start} scanning={scanning}/>
        <PageHero/>
        <div className="px-4 md:px-7 pb-10 space-y-6">
          <ScannerForm form={form} setForm={setForm}/>
          <PipelineCard progress={progress} scanning={scanning}/>
          <ResultsTable rows={results} openedScan={openedScan} onCloseScan={closeScan}/>
          <HistoryTable history={history} onOpen={openScan}/>
        </div>

        <footer className="border-t border-zinc-200 px-4 md:px-7 py-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 text-[11.5px] text-zinc-500">
          <span>© 2026 OA · Open Arbitrage</span>
          <span className="mono uppercase tracking-wider">v2.4.1 · build a9f1c</span>
        </footer>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);


</script>
</body>
</html>
